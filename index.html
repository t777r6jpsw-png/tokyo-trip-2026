<style>
:root{--bg:#f7f4ef;--card:#fff;--ink:#252525;--muted:#777;--line:#e7dfd5;--accent:#9a6a4e;--soft:#f2e8df;--green:#e7f2e9;--yellow:#fff4d6}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif}
header{background:rgba(255,255,255,.96);backdrop-filter:blur(12px);position:sticky;top:0;z-index:20;padding:calc(14px + env(safe-area-inset-top)) 14px 12px;border-bottom:1px solid var(--line)}
h1{font-size:22px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:3px}
.tabs{display:flex;gap:7px;overflow-x:auto;padding-top:12px}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;white-space:nowrap;font-size:13px}.tab.active{background:var(--ink);color:#fff}
main{max-width:900px;margin:auto;padding:14px}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-size:13px}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.dayhead{display:flex;justify-content:space-between;align-items:flex-end;margin:8px 2px 12px}.dayhead h2{font-size:20px;margin:0}.count{font-size:12px;color:var(--muted)}
.warn{background:var(--yellow);border:1px solid #eed58c;border-radius:12px;padding:11px 12px;font-size:12px;line-height:1.55;margin-bottom:10px}
.timeline{display:grid;gap:9px}.item{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px;display:grid;grid-template-columns:82px 1fr auto;gap:10px}.time{font-size:13px;font-weight:700;line-height:1.45}.title{font-weight:700;font-size:15px;line-height:1.4}.tag{display:inline-block;background:var(--soft);border-radius:6px;padding:3px 6px;font-size:10px;margin-top:5px}.note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:5px}.maps{display:inline-flex;margin-top:8px;background:var(--green);border-radius:8px;padding:7px 9px;color:#27623c;text-decoration:none;font-size:11px}.actions{display:flex;gap:3px}.iconbtn{border:0;background:transparent;font-size:16px;padding:3px}
.link-section{margin-top:24px}.linkcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px;margin:8px 0}.linkcard a{color:var(--accent);text-decoration:none;font-size:13px}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:50;align-items:flex-end;justify-content:center}.modal.open{display:flex}.box{background:#fff;width:min(600px,100%);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.full{grid-column:1/-1}label{font-size:11px;color:var(--muted)}input,select,textarea{width:100%;font:inherit;margin-top:4px;padding:10px;border:1px solid var(--line);border-radius:9px}textarea{min-height:70px}.modal-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:12px}
@media(max-width:560px){.item{grid-template-columns:72px 1fr 25px}.actions{flex-direction:column}}
</style></head>
<body>
