function modeText(mode){return mode==='walk'?'步行':mode==='taxi'?'計程車':'大眾運輸'}
function transportBetween(a,b,mode){
  const fixed={
    '池袋站|表參道':[30,'transit'],'表參道|澀谷 PARCO':[10,'transit'],'澀谷 PARCO|廻転鮨 銀座おのでら 本店':[15,'transit'],
    '池袋站|淺草寺':[35,'transit'],'紅鶴|淺草寺':[8,'walk'],'淺草寺|東京晴空塔':[10,'transit'],'東京晴空塔|叙々苑 池袋サンシャイン通り店':[45,'transit'],
    '叙々苑 池袋サンシャイン通り店|RUTiLE IKEBUKURO TOKYO｜ルチル池袋東京':[8,'walk'],'池袋站|東京迪士尼樂園':[55,'transit'],
    'RUTiLE IKEBUKURO TOKYO｜ルチル池袋東京|琥珀 池袋 ラーメン':[10,'walk'],'RUTiLE IKEBUKURO TOKYO｜ルチル池袋東京|Sunshine City 池袋':[10,'walk'],
    '池袋站|銀座':[25,'transit'],'銀座|池袋站':[25,'transit'],'池袋站|Chikawa Park':[12,'walk'],'Chikawa Park|池袋站':[12,'walk'],
    '成田國際機場|池袋站':[85,'transit'],'池袋站|成田國際機場':[85,'transit'],'桃園國際機場|成田國際機場':[240,'transit'],
    '東京迪士尼樂園|池袋站':[55,'transit']
  };
  const key=a+'|'+b;
  if(fixed[key]) return {minutes:fixed[key][0],mode:mode||fixed[key][1]};
  const m=minutesBetween(a,b,mode||'transit');
  return m?{minutes:m,mode:mode||'transit'}:null;
}
function routeCard(d,i,x,next){
  const from=x[5]||x[2], to=next[5]||next[2];
  if(!from||!to||from===to)return '';
  let mode=x[12]||'transit'; const r=transportBetween(from,to,mode);
  if(!r)return `<div class="transport-gap"><div class="tg-icon">🚆</div><div class="tg-line"><div class="tg-title">${esc(from)} → ${esc(to)}</div><div class="tg-meta">尚未設定路線時間</div></div><button onclick="editItem(${i})">設定</button></div>`;
  const start=x[1]||''; const end=start?addTime(start,r.minutes):'';
  return `<div class="transport-gap"><div class="tg-icon">${transportIcon(r.mode)}</div><div class="tg-line"><div class="tg-title">${esc(from)} → ${esc(to)}</div><div class="tg-meta">${modeText(r.mode)} ・ 約 ${r.minutes} 分鐘${start?` ・ ${esc(start)} → ${esc(end)}`:''}</div></div><select onchange="setRouteMode(${i},this.value)"><option value="transit" ${r.mode==='transit'?'selected':''}>🚆 電車</option><option value="walk" ${r.mode==='walk'?'selected':''}>🚶 步行</option><option value="taxi" ${r.mode==='taxi'?'selected':''}>🚕 計程車</option></select></div>`;
}
function addTime(t,m){const p=t.split(':').map(Number);let n=p[0]*60+p[1]+m;n%=1440;return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function setRouteMode(i,mode){data.days[dayIndex].items[i][12]=mode;save();render()}

links.innerHTML=(data.links[d.date]||[]).map(l=>`<div class="linkcard"><strong>${esc(l[0])}</strong><br><a href="${esc(l[1])}">開啟預約／訂票網站 ↗</a></div>`).join("")||'<div class="note">本日沒有固定網站；上方每個需要預約的行程會自動產生查詢。</div>';
let a=[];if(d.date==="2026-12-03")a.push("🎄 12/3 花車／夜間遊行的確切時間待官方公布。 ");if(d.date==="2026-12-07")a.push("✈️ 15:00 池袋→成田為暫估，需依航班時間鎖定車次。");notice.innerHTML=a.map(v=>`<div class="warn">${v}</div>`).join("")}

const locationChoices=()=>{const a=[];data.days.forEach(d=>d.items.forEach(x=>{const v=x[5]||x[6]||x[2];if(v&&!a.some(z=>z[0]===v))a.push([v,x[6]||x[5]||v])}));return a.sort((a,b)=>a[0].localeCompare(b[0]));};
const routeCoords={"RUTiLE IKEBUKURO TOKYO｜ルチル池袋東京":[35.7312,139.7109],"池袋站":[35.7295,139.7109],"桃園國際機場":[25.0797,121.2342],"成田國際機場":[35.7720,140.3929],"東京迪士尼樂園":[35.6329,139.8804],"紅鶴":[35.7118,139.7928],"淺草寺":[35.7148,139.7967],"東京晴空塔":[35.7101,139.8107],"叙々苑 池袋サンシャイン通り店":[35.7292,139.7140],"表參道":[35.6652,139.7120],"廻転鮨 銀座おのでら 本店":[35.6650,139.7107],"澀谷 PARCO":[35.6626,139.6987],"銀座":[35.6717,139.7650],"Chikawa Park":[35.7289,139.7190]};
function minutesBetween(a,b,mode){if(!a||!b)return null;if(a===b)return 5;const A=routeCoords[a],B=routeCoords[b];if(!A||!B)return null;const R=6371,rad=Math.PI/180;const dlat=(B[0]-A[0])*rad,dlon=(B[1]-A[1])*rad;const h=Math.sin(dlat/2)**2+Math.cos(A[0]*rad)*Math.cos(B[0]*rad)*Math.sin(dlon/2)**2;const km=2*R*Math.asin(Math.sqrt(h));let mins=mode==='walk'?km/4.5*60:mode==='taxi'?km/28*60+8:km/20*60+12;mins=Math.max(5,Math.round(mins/5)*5);return mins;}
function fillPlaceOptions(selectedFrom='',selectedTo=''){const opts=locationChoices();const html='<option value="">請選擇地點</option>'+opts.map(v=>`<option value="${esc(v[0])}">${esc(v[0])}</option>`).join('');fFrom.innerHTML=html;fTo.innerHTML=html;fFrom.value=selectedFrom||'';fTo.value=selectedTo||'';}
function autoRoute(){const m=minutesBetween(fFrom.value,fTo.value,fMode.value);if(!m)return alert('這兩個地點目前沒有內建路線資料；可先填寫開始／結束時間。');if(!fStart.value)return alert('請先選擇開始時間。');const [h,mi]=fStart.value.split(':').map(Number);const total=h*60+mi+m;const eh=Math.floor(total/60)%24, em=total%60;fEnd.value=String(eh).padStart(2,'0')+':'+String(em).padStart(2,'0');if(!fTitle.value)fTitle.value=`${fFrom.value} → ${fTo.value}`;fNote.value=`自動估算通勤約 ${m} 分鐘（${fMode.options[fMode.selectedIndex].text.replace(/^[^ ]+ /,'')}，實際時間會受班次、等車與步行影響）。`;}

fAdvance.addEventListener('change',toggleCustom);

function allReminders(){const out=[];data.days.forEach(d=>d.items.forEach((x,i)=>{const rule=x[8]||"0";if(rule!=="0"){const rd=reminderDate(d.date,rule,Number(x[9]||30));out.push({date:d.date,label:d.label,title:x[2],type:bookingType(x),rd,idx:i})}}));return out.sort((a,b)=>a.rd-b.rd)}
